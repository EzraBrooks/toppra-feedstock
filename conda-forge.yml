build_platform:
  osx_arm64: osx_64
  # Cross-compile for RISC-V-64 Linux from x86-64 Linux
  linux_riscv64: linux_64

conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_64: default
  linux_aarch64: default
  osx_64: default
  osx_arm64: default
  win_64: default
test: native_and_emulated
